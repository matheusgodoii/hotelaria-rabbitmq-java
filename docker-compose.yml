services:
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: hotel-rabbitmq
    hostname: hotel-habbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
        RABBITMQ_DEFAULT_USER: hotel
        RABBITMQ_DEFAULT_PASS: hotel123
    volumes:
      - rabbitmq_data:/ver/lib/rabbitmq

volumes:
  rabbitmq_data: