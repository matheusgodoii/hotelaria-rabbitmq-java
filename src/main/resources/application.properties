spring.application.name=hotelaria

# Conexao com o RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=hotel
spring.rabbitmq.password=hotel123

# Confirmar mensagem somente apos o processamento
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Porta da API
server.port=8080


# PREPARACAO DE CHEGADAS

# Cada consumidor recebe no maximo uma mensagem pendente de ACK
spring.rabbitmq.listener.simple.prefetch=1

# Uma thread consumidora por instancia Java
spring.rabbitmq.listener.simple.concurrency=1

# Identificacao da instancia (pode ser alterada no terminal)
app.instancia=preparacao-padrao
